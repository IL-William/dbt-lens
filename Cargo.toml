[package]
name = "dbt-lens"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "A tiny browser-based IDE for dbt projects: editor, terminal and lineage from manifest.json"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
mime_guess = "2"
portable-pty = "0.9"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
